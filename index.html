<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f3f8">
<title>Vivrê · 2027</title>
<style>
:root{
  --roxo:#765b9b; --roxo-escuro:#50376f; --roxo-medio:#927bb0;
  --lilas:#f0e9f5; --lilas-borda:#cbb8dc;
  --ouro:#e6b54c; --ouro-claro:#fff2d7; --ouro-borda:#d99e27;
  --fundo:#faf8fb; --papel:#fff; --texto:#382c43; --cinza:#a99eae;
  --linha:#e6dfe9; --sombra:0 16px 42px rgba(69,48,85,.18);
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:linear-gradient(110deg,#fff 0%,#f7f1fa 65%,#fdf8ed 100%);border-bottom:3px solid #e8c66e}
.topo{max-width:1440px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{width:min(330px,42vw);height:auto;object-fit:contain;object-position:left center}
.ano{display:flex;align-items:center;gap:20px;color:var(--roxo-escuro);font-size:clamp(24px,3vw,38px);font-weight:750;white-space:nowrap}
.ano button,.mes button{border:0;background:transparent;color:var(--roxo);font-size:28px;cursor:pointer;border-radius:50%;width:42px;height:42px}
.ano button:hover,.mes button:hover{background:var(--lilas)}
main{max-width:1440px;margin:0 auto;padding:18px 24px 28px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.mes{display:flex;align-items:center;gap:14px}
.mes h1{font-size:clamp(25px,3vw,36px);margin:0;color:var(--roxo-escuro);min-width:190px}
.legenda{display:flex;gap:20px;flex-wrap:wrap;font-size:14px;color:var(--roxo-escuro)}
.legenda span{display:flex;align-items:center;gap:8px}
.ponto{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none}
.ponto.comem{background:var(--roxo-medio)}
.ponto.evento{background:var(--ouro)}
.ponto.feriado{background:var(--roxo-medio)}
.calendario{background:#fff;border:1px solid var(--lilas-borda);border-radius:15px;overflow:hidden;box-shadow:0 5px 20px rgba(67,45,80,.06)}
.grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cab-dia{background:var(--roxo);color:white;text-align:center;font-weight:650;padding:13px 4px;font-size:15px;border-right:1px solid rgba(255,255,255,.22)}
.celula{min-height:112px;border-right:1px solid var(--linha);border-top:1px solid var(--linha);padding:9px 8px;text-align:left;background:#fff;cursor:pointer;position:relative;transition:background .15s}
.celula:nth-child(7n){border-right:0}
.celula:hover{background:#fbf8fd}
.celula.fora{background:#fcfbfc;color:#b9aebf}
.celula.feriado{background:var(--lilas);box-shadow:inset 0 0 0 1px var(--lilas-borda)}
.celula.tem-evento{background:var(--ouro-claro);box-shadow:inset 0 0 0 2px var(--ouro-borda);border-radius:9px}
.celula.feriado.tem-evento{background:linear-gradient(135deg,var(--lilas) 0 50%,var(--ouro-claro) 50% 100%);box-shadow:inset 0 0 0 2px var(--ouro-borda)}
.numero{font-size:20px;font-weight:650;line-height:1.2;color:var(--roxo-escuro);display:block;margin-bottom:8px}
.fora .numero{color:#b9aebf}
.marcacao{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.25;margin:5px 0;color:var(--roxo-escuro);overflow:hidden}
.marcacao .ponto{margin-top:2px;width:9px;height:9px}
.marcacao.discreta{font-size:10px;opacity:.72}
.marcacao.evento{color:#72501a}
.marcacao.evento .ponto{background:var(--ouro-borda)}
.mais{font-size:11px;color:#75647e;margin:4px 0 0 15px}
.rodape{padding:15px 2px;color:#78658b;font-size:13px}
button:focus-visible,.celula:focus-visible{outline:3px solid #b99bd4;outline-offset:-3px}
.overlay{position:fixed;inset:0;background:rgba(42,30,52,.34);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
.overlay.aberto{display:flex}
.modal{width:min(520px,100%);background:white;border-radius:18px;overflow:hidden;box-shadow:var(--sombra);animation:entra .18s ease-out}
@keyframes entra{from{transform:translateY(10px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-topo{background:var(--roxo);color:#fff;padding:17px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-topo strong{font-size:20px}
.fechar{border:0;background:transparent;color:white;font-size:28px;cursor:pointer;line-height:1}
.modal-corpo{padding:18px 20px 20px}
.bloco{display:flex;gap:13px;align-items:flex-start;padding:9px 0}
.bolao{width:16px;height:16px;border-radius:50%;margin-top:5px;flex:none;background:var(--roxo-medio)}
.bolao.evento{background:var(--ouro)}
.bloco strong{font-size:17px;color:var(--roxo-escuro)}
.bloco p{margin:4px 0 0;font-size:14px;line-height:1.4;color:#675a6d}
.separador{border:0;border-top:1px solid var(--linha);margin:10px 0}
.acoes{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.acao{border:1px solid var(--roxo);background:white;color:var(--roxo-escuro);padding:10px 15px;border-radius:11px;font-weight:650;cursor:pointer}
.acao.principal{background:var(--ouro);border-color:var(--ouro);color:#4d3917}
.acao.perigo{border-color:#c98a8a;color:#9b4b4b}
.vazio{color:#7f7185;font-size:14px;padding:8px 0}
.formulario{display:none;border-top:1px solid var(--linha);margin-top:14px;padding-top:14px}
.formulario.aberto{display:block}
.formulario label{display:block;font-size:13px;color:#66576f;margin:10px 0 5px}
.formulario input,.formulario textarea{width:100%;border:1px solid #d9cedf;border-radius:9px;padding:10px;font:inherit;color:var(--texto);background:#fff}
.formulario textarea{min-height:65px;resize:vertical}
.cores{display:flex;gap:10px;margin-top:7px}
.cor{width:27px;height:27px;border-radius:50%;border:2px solid white;box-shadow:0 0 0 1px #b9a9c2;cursor:pointer}
.cor.selecionada{box-shadow:0 0 0 3px var(--roxo)}
@media(max-width:700px){
 .topo{padding:9px 14px;gap:8px}.logo{width:48%;max-width:210px}.ano{gap:3px;font-size:24px}.ano button{width:32px;height:36px;font-size:23px}
 main{padding:14px 10px 22px}.barra{align-items:flex-start;gap:8px}.mes{gap:5px}.mes h1{font-size:26px;min-width:145px}.mes button{width:34px;height:36px;font-size:23px}
 .legenda{font-size:11px;gap:12px}.ponto{width:10px;height:10px}
 .cab-dia{font-size:12px;padding:10px 1px}
 .celula{min-height:77px;padding:6px 4px}.numero{font-size:16px;margin-bottom:6px}
 .marcacao{font-size:10px;gap:4px;margin:4px 0}.marcacao .ponto{width:7px;height:7px}
 .mais{font-size:9px;margin-left:11px}
 .overlay{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;width:100%;max-height:82vh;overflow:auto}.modal-topo{padding:15px 17px}.modal-topo strong{font-size:18px}.modal-corpo{padding:14px 17px 22px}
 .acoes{gap:7px}.acao{padding:10px 12px;font-size:13px}
}
@media(max-width:390px){.logo{width:45%}.ano{font-size:21px}.mes h1{font-size:23px;min-width:132px}.celula{min-height:68px}.marcacao{font-size:9px}}

/* Ajustes visuais — versão compacta */
header{border-bottom:2px solid #e8d9b7}
.topo{padding:5px 20px;gap:12px}
.logo{width:min(190px,30vw);max-height:76px}
.ano{font-size:clamp(22px,2.4vw,30px);gap:10px}
.ano button{width:34px;height:34px;font-size:24px}
main{padding:8px 18px 12px}
.barra{margin-bottom:8px}
.mes h1{font-size:clamp(23px,2.5vw,30px)}
.cab-dia{padding:8px 3px;font-size:14px}
.celula{min-height:clamp(72px, calc((100vh - 220px)/6), 104px);padding:7px 7px}
.numero{font-size:18px;font-weight:750;text-align:left;margin:0 0 6px 3px}
.marcacao{font-size:11px;line-height:1.2;margin:3px 0}
.marcacao.evento{
 display:block;width:100%;padding:4px 6px;border-radius:6px;
 font-size:11px;font-weight:750;line-height:1.15;overflow-wrap:anywhere;
}
.marcacao.evento .ponto{display:none}
.rodape{display:none}
@media(max-width:700px){
 .topo{padding:4px 10px;gap:6px}.logo{width:min(145px,39vw);max-height:58px}
 .ano{font-size:21px;gap:2px}.ano button{width:29px;height:32px;font-size:22px}
 main{padding:8px 7px 12px}.barra{margin-bottom:7px;gap:7px}
 .mes{gap:3px}.mes h1{font-size:23px;min-width:130px}.mes button{width:30px;height:32px;font-size:21px}
 .legenda{font-size:10px;gap:8px}
 .cab-dia{font-size:11px;padding:8px 1px}
 .celula{min-height:clamp(62px, calc((100svh - 220px)/6), 82px);padding:5px 3px}
 .numero{font-size:15px;margin:0 0 5px 2px}
 .marcacao{font-size:9px;line-height:1.15;margin:3px 0;gap:3px}
 .marcacao .ponto{width:6px;height:6px}
 .marcacao.evento{font-size:9px;padding:3px 3px;border-radius:5px}
 .mais{font-size:9px;margin-left:2px}
 .overlay{align-items:flex-end;padding:0}.modal{border-radius:18px 18px 0 0;width:100%;max-height:82vh;overflow:auto}
 .modal-topo{padding:15px 17px}.modal-topo strong{font-size:18px}.modal-corpo{padding:14px 17px 22px}
 .acoes{gap:7px}.acao{padding:10px 12px;font-size:13px}
}
@media(max-width:390px){
 .logo{width:36vw}.ano{font-size:19px}.mes h1{font-size:21px;min-width:118px}
 .celula{min-height:62px}.marcacao.evento{font-size:8px;padding:3px 2px}
}


/* Alinhamento fixo dos números: a posição não depende dos eventos */
.celula{position:relative;padding-top:29px!important}
.numero{
 position:absolute!important;
 top:4px!important;
 left:7px!important;
 margin:0!important;
 padding:0!important;
 line-height:1!important;
 text-align:left!important;
}
@media(max-width:700px){
 .celula{padding-top:25px!important}
 .numero{top:4px!important;left:4px!important}
}
@media(max-width:390px){
 .celula{padding-top:23px!important}
 .numero{top:3px!important;left:4px!important}
}


/* Confirmação integrada usando o elemento nativo dialog (camada superior do navegador) */
.confirm-dialog{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:18px;border:0;background:transparent;overflow:auto;}
.confirm-dialog[open]{display:flex;align-items:center;justify-content:center;}
.confirm-dialog::backdrop{background:rgba(42,30,52,.48)}
.confirm-modal{width:min(390px,100%);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 18px 48px rgba(40,25,50,.28);animation:entra .16s ease-out}
.confirm-topo{background:var(--roxo);color:#fff;padding:15px 18px;font-size:18px;font-weight:750}
.confirm-corpo{padding:18px;color:var(--texto);font-size:15px;line-height:1.45}
.confirm-acoes{display:flex;justify-content:flex-end;gap:9px;padding:0 18px 18px}
.confirm-acoes button{min-height:42px}
.confirm-acoes .confirm-excluir{background:#a95656;border-color:#a95656;color:#fff}
@media(max-width:700px){.confirm-dialog{align-items:flex-end!important;padding:0}.confirm-modal{width:100%;border-radius:18px 18px 0 0}.confirm-topo{padding:15px 17px}.confirm-corpo{padding:17px}.confirm-acoes{padding:0 17px 22px}}


/* Acesso seguro e sincronização em nuvem */
.acesso{max-width:1440px;margin:0 auto;padding:9px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--linha);font-size:13px;color:var(--roxo-escuro)}
.acesso .grupo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.acesso button{border:1px solid var(--roxo);background:var(--roxo);color:#fff;border-radius:9px;padding:8px 13px;font:inherit;font-weight:700;cursor:pointer}
.acesso button.secundario{background:#fff;color:var(--roxo-escuro)}
@media(max-width:700px){.acesso{padding:8px 10px;font-size:12px}.acesso button{padding:8px 10px}}
</style>
</head>

 if(!com.length&&!ev.length)lista.innerHTML='<div class="vazio">Nenhuma data comemorativa ou evento cadastrado neste dia.</div>';
 com.forEach(x=>{const b=document.createElement("div");b.className="bloco";b.innerHTML=`<i class="bolao"></i><div><strong></strong>${x.descricao?'<p></p>':''}</div>`;b.querySelector("strong").textContent=x.nome;if(x.descricao)b.querySelector("p").textContent=x.descricao;lista.appendChild(b)});
 if(com.length&&ev.length){const hr=document.createElement("hr");hr.className="separador";lista.appendChild(hr)}
 ev.forEach((x,i)=>{const b=document.createElement("div");b.className="bloco";b.innerHTML='<i class="bolao evento"></i><div><strong></strong></div>';b.querySelector("strong").textContent=x.nome;b.querySelector(".bolao").style.background=x.cor||"#e6b54c";lista.appendChild(b)});
 const acoes=el("acoes");acoes.innerHTML="";
 ev.forEach((x,i)=>{const ed=document.createElement("button");ed.className="acao";ed.textContent="Editar";ed.onclick=()=>formEvento(i);acoes.appendChild(ed);const del=document.createElement("button");del.className="acao perigo";del.textContent="Excluir";del.onclick=()=>pedirConfirmacao(async()=>{eventos[k].splice(i,1);if(!eventos[k].length)delete eventos[k];try{await persistir();mostrarDetalhes();desenhar()}catch(e){console.error(e);alert("Não foi possível excluir no calendário compartilhado. Confira a conexão e as permissões.")}});acoes.appendChild(del)});
 const novo=document.createElement("button");novo.className="acao principal";novo.textContent="+ Novo evento";novo.onclick=()=>formEvento(null);acoes.appendChild(novo);
}
function formEvento(i){editando=i;const ev=i===null?null:eventos[chave(selecionada.a,selecionada.m,selecionada.d)][i];el("nomeEvento").value=ev?.nome||"";corEscolhida=ev?.cor||"#e6b54c";el("corEvento").value=corEscolhida;el("formulario").classList.add("aberto");el("nomeEvento").focus()}
async function persistir(){
 if(!usuarioAtual)throw new Error("Acesso não autorizado");
 await setDoc(eventosRef,{eventos,atualizadoEm:new Date().toISOString(),atualizadoPor:usuarioAtual.email},{merge:true});
}
el("corEvento").addEventListener("input",()=>{corEscolhida=el("corEvento").value});
el("salvar").onclick=async()=>{const nome=el("nomeEvento").value.trim();if(!nome){alert("Digite o nome do evento.");return}const k=chave(selecionada.a,selecionada.m,selecionada.d);eventos[k]??=[];const item={nome,cor:el("corEvento").value};if(editando===null)eventos[k].push(item);else eventos[k][editando]=item;try{await persistir();el("formulario").classList.remove("aberto");mostrarDetalhes();desenhar()}catch(e){console.error(e);alert("Não foi possível salvar no calendário compartilhado. Confira a conexão e as permissões do banco.")}};
el("cancelarForm").onclick=()=>el("formulario").classList.remove("aberto");
el("fechar").onclick=()=>el("overlay").classList.remove("aberto");
el("overlay").addEventListener("click",e=>{if(e.target===el("overlay"))el("overlay").classList.remove("aberto")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(el("confirmOverlay").open)fecharConfirmacao();else el("overlay").classList.remove("aberto")}});
el("mesMenos").onclick=()=>{mes--;if(mes<0){mes=11;ano--}desenhar()};
el("mesMais").onclick=()=>{mes++;if(mes>11){mes=0;ano++}desenhar()};
el("anoMenos").onclick=()=>{ano--;desenhar()};
el("anoMais").onclick=()=>{ano++;desenhar()};
desenhar();

const loginBtn=document.getElementById("entrarGoogle"), logoutBtn=document.getElementById("sairGoogle"), statusEl=document.getElementById("acessoStatus");
loginBtn.onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(e.code==="auth/popup-blocked"){await signInWithRedirect(auth,provider)}else{console.error(e);alert("Não foi possível entrar com Google. Tente novamente.")}}};
logoutBtn.onclick=()=>signOut(auth);
getRedirectResult(auth).catch(e=>console.error("Falha ao concluir entrada:",e));
onAuthStateChanged(auth,user=>{
 usuarioAtual=user||null; if(pararEscuta){pararEscuta();pararEscuta=null;}
 if(user){statusEl.textContent="Conectado: "+user.email;loginBtn.hidden=true;logoutBtn.hidden=false;carregandoEventos=true;eventos={};desenhar();
  pararEscuta=onSnapshot(eventosRef,snap=>{eventos=snap.exists()?(snap.data().eventos||{}):{};carregandoEventos=false;desenhar();if(selecionada)mostrarDetalhes()},err=>{console.error(err);carregandoEventos=false;statusEl.textContent="Erro ao acessar o banco de dados";desenhar()});
 }else{eventos={};carregandoEventos=false;statusEl.textContent="Entre com a conta Google autorizada para acessar os eventos";loginBtn.hidden=false;logoutBtn.hidden=true;desenhar();if(selecionada)mostrarDetalhes();}
});
</script>
</body>
</html>
